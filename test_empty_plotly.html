<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div id="plot" style="width: 400px; height: 300px;"></div>
    <script>
        Plotly.newPlot('plot', [{x: [2.7, null, 2.9], y: [-120, -125, -130], type: 'scatter', mode: 'lines'}], {
            xaxis: {title: 'Frequency (GHz)', range: [2.7, 4.1]},
            yaxis: {title: 'NP (dBm)', range: [-170, -110]}
        });
    </script>
</body>
</html>
